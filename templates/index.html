<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingMind</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f0f11;
    --surface: #17171a;
    --border: #2a2a30;
    --accent: #c8f060;
    --accent2: #60c8f0;
    --text: #e8e8ec;
    --muted: #6b6b7a;
    --danger: #f06060;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 32px 20px;
  }

  .app { max-width: 760px; margin: 0 auto; }

  .header { margin-bottom: 40px; }
  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 { font-size: 28px; font-weight: 300; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); font-weight: 600; }

  .steps { display: flex; gap: 8px; margin-bottom: 32px; }
  .step { height: 3px; flex: 1; background: var(--border); border-radius: 2px; transition: background 0.3s; }
  .step.active { background: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 16px; }
  .card-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }

  textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.6;
    padding: 14px 16px; resize: vertical; min-height: 160px; outline: none; transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .mode-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .mode-btn {
    flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 13px; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .mode-btn.selected { border-color: var(--accent); color: var(--accent); background: rgba(200,240,96,0.06); }

  .roles-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .role-chip {
    padding: 7px 14px; border-radius: 100px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: all 0.2s; font-family: 'DM Sans', sans-serif;
  }
  .role-chip.selected { border-color: var(--accent2); color: var(--accent2); background: rgba(96,200,240,0.08); }

  .custom-roles { display: flex; flex-direction: column; gap: 10px; }
  .custom-role-row { display: flex; gap: 8px; align-items: center; }
  .custom-role-row input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 9px 13px; outline: none; transition: border-color 0.2s;
  }
  .custom-role-row input:focus { border-color: var(--accent2); }
  .custom-role-row input::placeholder { color: var(--muted); }
  .remove-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .remove-btn:hover { border-color: var(--danger); color: var(--danger); }
  .add-role-btn {
    background: transparent; border: 1px dashed var(--border); color: var(--muted);
    border-radius: 8px; padding: 9px; cursor: pointer; font-size: 13px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s; text-align: center; width: 100%;
  }
  .add-role-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  .submit-btn {
    width: 100%; padding: 15px; background: var(--accent); color: #0f0f11;
    border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .submit-btn:hover { background: #d4f470; transform: translateY(-1px); }
  .submit-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

  .loading { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }
  .loading-dot {
    display: inline-block; width: 6px; height: 6px; background: var(--accent);
    border-radius: 50%; margin: 0 3px; animation: bounce 1.2s infinite;
  }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-8px); opacity: 1; }
  }

  .overview-box {
    background: rgba(200,240,96,0.05); border: 1px solid rgba(200,240,96,0.2);
    border-radius: 10px; padding: 18px 20px; font-size: 14px; line-height: 1.7; margin-bottom: 16px;
  }
  .overview-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; }

  .result-role-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .result-role-btn {
    padding: 8px 16px; border-radius: 100px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: all 0.2s; font-family: 'DM Sans', sans-serif;
  }
  .result-role-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(96,200,240,0.08); }

  .todo-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .todo-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .todo-role-name { font-size: 15px; font-weight: 600; color: var(--accent2); }
  .todo-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .todo-list { padding: 12px 16px; }
  .todo-item {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px 6px;
    border-bottom: 1px solid rgba(42,42,48,0.6); cursor: pointer; transition: background 0.15s; border-radius: 6px;
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-item:hover { background: rgba(255,255,255,0.02); }
  .todo-checkbox {
    width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border);
    flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .todo-item.done .todo-checkbox { background: var(--accent); border-color: var(--accent); }
  .todo-item.done .todo-checkbox::after { content: '✓'; font-size: 11px; color: #0f0f11; font-weight: 700; }
  .todo-text { font-size: 14px; line-height: 1.5; color: var(--text); transition: all 0.2s; flex: 1; }
  .todo-item.done .todo-text { color: var(--muted); text-decoration: line-through; }

  .decision-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.5; }
  .decision-item:last-child { border-bottom: none; }
  .decision-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; flex-shrink: 0; margin-top: 6px; }

  .reset-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 10px 20px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 13px; margin-top: 20px; transition: all 0.2s;
  }
  .reset-btn:hover { border-color: var(--text); color: var(--text); }

  .hidden { display: none; }
  .error-msg { background: rgba(240,96,96,0.08); border: 1px solid rgba(240,96,96,0.3); color: #f09090; border-radius: 8px; padding: 14px 16px; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">MeetingMind</div>
    <h1>会后清单 <span>Bot</span></h1>
  </div>

  <div class="steps">
    <div class="step active" id="step1"></div>
    <div class="step" id="step2"></div>
    <div class="step" id="step3"></div>
  </div>

  <div id="inputSection">
    <div class="card">
      <div class="card-label">第一步 · 粘贴会议记录</div>
      <textarea id="meetingText" placeholder="把会议记录粘贴到这里，可以是任意格式的会议纪要、聊天记录、或语音转文字内容..."></textarea>
    </div>

    <div class="card">
      <div class="card-label">第二步 · 选择角色模式</div>
      <div class="mode-row">
        <button class="mode-btn selected" id="modeQuick" onclick="setMode('quick')">⚡ 快速模式<br><span style="font-size:11px;opacity:0.6">使用预设角色</span></button>
        <button class="mode-btn" id="modeCustom" onclick="setMode('custom')">✏️ 精准模式<br><span style="font-size:11px;opacity:0.6">输入参会人与职位</span></button>
      </div>

      <div id="quickMode">
        <div class="card-label" style="margin-top:12px">选择你的当前职位</div>
        <div class="roles-grid">
          <button class="role-chip" onclick="selectQuickRole(this, 'PM（产品经理）')">PM（产品经理）</button>
          <button class="role-chip" onclick="selectQuickRole(this, '开发工程师')">开发工程师</button>
          <button class="role-chip" onclick="selectQuickRole(this, 'UI/UX设计师')">UI/UX设计师</button>
          <button class="role-chip" onclick="selectQuickRole(this, '运营')">运营</button>
          <button class="role-chip" onclick="selectQuickRole(this, '市场')">市场</button>
          <button class="role-chip" onclick="selectQuickRole(this, '数据分析师')">数据分析师</button>
        </div>
      </div>

      <div id="customMode" class="hidden">
        <div class="card-label" style="margin-top:12px">输入参会人信息</div>
        <div class="custom-roles" id="customRolesList">
          <div class="custom-role-row">
            <input type="text" placeholder="姓名" style="flex:0.6" oninput="updateMyRoleChips()">
            <input type="text" placeholder="职位/角色" oninput="updateMyRoleChips()">
            <button class="remove-btn" onclick="removeRole(this)">×</button>
          </div>
          <div class="custom-role-row">
            <input type="text" placeholder="姓名" style="flex:0.6" oninput="updateMyRoleChips()">
            <input type="text" placeholder="职位/角色" oninput="updateMyRoleChips()">
            <button class="remove-btn" onclick="removeRole(this)">×</button>
          </div>
        </div>
        <button class="add-role-btn" onclick="addRole()">＋ 添加参会人</button>
        <div style="margin-top:14px">
          <div class="card-label">我的职位是</div>
          <div class="roles-grid" id="myRoleChips" style="margin-top:8px"></div>
        </div>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="analyze()">开始解析 →</button>
    <div class="error-msg hidden" id="errorMsg"></div>
  </div>

  <div class="hidden" id="loadingSection">
    <div class="loading">
      <div style="margin-bottom:16px">
        <span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>
      </div>
      AI 正在解析会议内容...
    </div>
  </div>

  <div class="hidden" id="resultSection">
    <div class="overview-box">
      <div class="overview-label">会议概览</div>
      <div id="overviewText"></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-label">关键决策</div>
      <div id="decisionsList"></div>
    </div>

    <div class="card-label" style="margin-bottom:10px">我的 Todo</div>
    <div class="todo-card">
      <div class="todo-header">
        <div class="todo-role-name" id="currentRoleName"></div>
        <div class="todo-count" id="todoCount"></div>
      </div>
      <div class="todo-list" id="todoList"></div>
    </div>

    <button class="reset-btn" onclick="reset()">← 重新解析</button>
  </div>
</div>

<script>
let mode = 'quick';
let selectedQuickRole = '';
let selectedMyRole = '';
let resultData = null;

function setMode(m) {
  mode = m;
  document.getElementById('modeQuick').classList.toggle('selected', m === 'quick');
  document.getElementById('modeCustom').classList.toggle('selected', m === 'custom');
  document.getElementById('quickMode').classList.toggle('hidden', m !== 'quick');
  document.getElementById('customMode').classList.toggle('hidden', m !== 'custom');
  if (m === 'custom') updateMyRoleChips();
}

function selectQuickRole(btn, role) {
  document.querySelectorAll('.role-chip').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedQuickRole = role;
}

function addRole() {
  const list = document.getElementById('customRolesList');
  const row = document.createElement('div');
  row.className = 'custom-role-row';
  row.innerHTML = `<input type="text" placeholder="姓名" style="flex:0.6" oninput="updateMyRoleChips()"><input type="text" placeholder="职位/角色" oninput="updateMyRoleChips()"><button class="remove-btn" onclick="removeRole(this)">×</button>`;
  list.appendChild(row);
  updateMyRoleChips();
}

function removeRole(btn) {
  btn.parentElement.remove();
  updateMyRoleChips();
}

function updateMyRoleChips() {
  const rows = document.querySelectorAll('#customRolesList .custom-role-row');
  const chips = document.getElementById('myRoleChips');
  chips.innerHTML = '';
  selectedMyRole = '';
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    const name = inputs[0].value.trim();
    const role = inputs[1].value.trim();
    if (name || role) {
      const label = name && role ? `${name}（${role}）` : name || role;
      const chip = document.createElement('button');
      chip.className = 'role-chip';
      chip.textContent = label;
      chip.onclick = () => {
        document.querySelectorAll('#myRoleChips .role-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        selectedMyRole = label;
      };
      chips.appendChild(chip);
    }
  });
}

async function analyze() {
  const text = document.getElementById('meetingText').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.classList.add('hidden');

  if (!text) { showError('请粘贴会议记录内容'); return; }

  let myRole = '';
  let allRoles = [];

  if (mode === 'quick') {
    if (!selectedQuickRole) { showError('请选择你的当前职位'); return; }
    myRole = selectedQuickRole;
    allRoles = ['PM（产品经理）', '开发工程师', 'UI/UX设计师', '运营', '市场', '数据分析师'];
  } else {
    if (!selectedMyRole) { showError('请先选择"我的职位是"'); return; }
    myRole = selectedMyRole;
    const rows = document.querySelectorAll('#customRolesList .custom-role-row');
    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      const name = inputs[0].value.trim();
      const role = inputs[1].value.trim();
      if (name || role) allRoles.push(name && role ? `${name}（${role}）` : name || role);
    });
  }

  document.getElementById('inputSection').classList.add('hidden');
  document.getElementById('loadingSection').classList.remove('hidden');
  document.getElementById('step2').classList.add('active');

  const safeText = text.length > 5000 ? text.slice(0, 5000) + '\n[内容已截断]' : text;
  const prompt = `分析以下会议记录，只输出JSON，不要任何其他文字或markdown符号。

会议记录：
${safeText}

当前用户角色：${myRole}

输出格式（严格JSON，不要换行缩进）：
{"overview":"2-3句话总结","decisions":["决策1","决策2"],"todos":{"${myRole}":["任务1","任务2","任务3"]}}

todos只包含${myRole}的行动项，2-4条，从会议中直接提取。`;

  try {
    const response = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error || 'API错误');
    if (!data.data) throw new Error('返回数据为空，请重试');

    resultData = data.data;
    resultData.myRole = myRole;
    // 如果精确匹配不到，找最接近的key
    if (!resultData.todos[myRole]) {
      const keys = Object.keys(resultData.todos || {});
      if (keys.length > 0) resultData.myRole = keys[0];
    }
    showResult();
  } catch (e) {
    document.getElementById('loadingSection').classList.add('hidden');
    document.getElementById('inputSection').classList.remove('hidden');
    showError('解析失败：' + (e.message || '请重试'));
  }
}

function showResult() {
  document.getElementById('loadingSection').classList.add('hidden');
  document.getElementById('resultSection').classList.remove('hidden');
  document.getElementById('step3').classList.add('active');

  document.getElementById('overviewText').textContent = resultData.overview;

  const decList = document.getElementById('decisionsList');
  decList.innerHTML = (resultData.decisions || []).map(d =>
    `<div class="decision-item"><div class="decision-dot"></div><span>${d}</span></div>`
  ).join('');

  const todos = resultData.todos[resultData.myRole] || [];
  document.getElementById('currentRoleName').textContent = resultData.myRole;
  document.getElementById('todoCount').textContent = `${todos.length} 项任务`;

  const list = document.getElementById('todoList');
  list.innerHTML = todos.map((t, i) => `
    <div class="todo-item" id="todo-${i}" onclick="toggleTodo(${i})">
      <div class="todo-checkbox"></div>
      <div class="todo-text">${t}</div>
    </div>
  `).join('');
}

function toggleTodo(i) {
  document.getElementById(`todo-${i}`).classList.toggle('done');
  const total = document.querySelectorAll('.todo-item').length;
  const done = document.querySelectorAll('.todo-item.done').length;
  document.getElementById('todoCount').textContent = done > 0 ? `${done}/${total} 已完成` : `${total} 项任务`;
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function reset() {
  resultData = null;
  selectedQuickRole = '';
  selectedMyRole = '';
  document.getElementById('meetingText').value = '';
  document.querySelectorAll('.role-chip').forEach(c => c.classList.remove('selected'));
  document.getElementById('resultSection').classList.add('hidden');
  document.getElementById('inputSection').classList.remove('hidden');
  ['step2','step3'].forEach(s => document.getElementById(s).classList.remove('active'));
}
</script>
</body>
</html>
